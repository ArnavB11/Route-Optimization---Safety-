<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SafeRoute Gujarat</title>
  <meta name="description" content="Safety-aware route planner for Surat, Ahmedabad, Gandhinagar, Vadodara and Rajkot.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = localStorage.getItem("sr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <!-- ===== Left panel ===== -->
  <aside id="panel" class="panel" aria-label="Route planner">
    <button class="sheet-handle" id="sheet-handle" aria-label="Resize route panel"></button>
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l7 2.6v5.6c0 4.6-3 8.6-7 10.3-4-1.7-7-5.7-7-10.3V5.1z"/><path class="tick" d="M8.6 12.1l2.3 2.3 4.6-4.8"/></svg>
      </div>
      <div class="brand-text">
        <h1>SafeRoute <span>Gujarat</span></h1>
        <p>Choose your way with care.</p>
      </div>
      <button class="icon-btn" id="btn-insights" title="About safety" aria-label="About safety">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
    </header>

    <nav class="city-chips" id="city-chips" aria-label="Cities"></nav>

    <section class="planner">
      <div class="od">
        <div class="od-rail" aria-hidden="true"><span class="dot o"></span><span class="rail"></span><span class="dot d"></span></div>
        <div class="od-fields">
          <div class="field" data-role="origin">
            <input id="in-origin" type="text" placeholder="Choose starting point" autocomplete="off" spellcheck="false" aria-label="Starting point" enterkeyhint="next">
            <button class="field-btn" id="btn-locate" title="Use my location" aria-label="Use my location">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
            </button>
            <ul class="suggest" role="listbox"></ul>
          </div>
          <div class="field" data-role="destination">
            <input id="in-destination" type="text" placeholder="Choose destination" autocomplete="off" spellcheck="false" aria-label="Destination" enterkeyhint="search">
            <ul class="suggest" role="listbox"></ul>
          </div>
        </div>
        <button class="icon-btn swap" id="btn-swap" title="Swap" aria-label="Swap origin and destination">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3.5 7.5M7 4l3.5 3.5M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg>
        </button>
      </div>

      <div class="modes" role="tablist" aria-label="Travel mode">
        <button role="tab" data-mode="car" class="mode active" aria-selected="true">
          <svg viewBox="0 0 24 24"><path d="M5 17h14M5 17v2M19 17v2M4 13l1.6-4.6A2 2 0 017.5 7h9a2 2 0 011.9 1.4L20 13M4 13h16v4H4z"/><circle cx="7.5" cy="15" r=".6"/><circle cx="16.5" cy="15" r=".6"/></svg>
          <span>Car</span></button>
        <button role="tab" data-mode="two_wheeler" class="mode" aria-selected="false">
          <svg viewBox="0 0 24 24"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5L9 9h5l4.5 7.5M14 9l-1-3h3M9 9l3 7.5"/></svg>
          <span>2-wheeler</span></button>
        <button role="tab" data-mode="walk" class="mode" aria-selected="false">
          <svg viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3M9 12l1.5-4.5L14 9l2 3M12 15l-1.5-4"/></svg>
          <span>Walk</span></button>
      </div>

      <details class="trip-options"><summary>Trip options <span id="trip-summary"></span></summary><div class="controls">
        <div class="ctl">
          <div class="ctl-head">
            <label for="in-hour">Departure <small>(India time)</small></label>
            <span class="ctl-val" id="hour-val"></span>
          </div>
          <div class="time-row">
            <button class="chip small" id="btn-now">Now</button>
            <input type="range" id="in-hour" min="0" max="23.9833333333" step="0.0166666667" value="9" aria-label="Departure hour">
          </div>
        </div>
        <div class="ctl">
          <div class="ctl-head">
            <label for="in-safety">Safety priority</label>
            <span class="ctl-val" id="safety-val"></span>
          </div>
          <input type="range" id="in-safety" min="0" max="1" step="0.05" value="0.7" aria-label="Safety priority">
          <div class="ctl-scale"><span>Speed</span><span>Safety</span></div>
        </div>
        <div class="ctl inline">
          <label for="in-detour">Extra travel time</label>
          <div class="seg" id="in-detour" role="radiogroup">
            <button role="radio" data-v="0.1">10%</button><button role="radio" data-v="0.25" class="on">25%</button><button role="radio" data-v="0.5">50%</button><button role="radio" data-v="1">100%</button>
          </div>
        </div>
      </div></details>
      <div class="planner-actions"><button id="btn-plan" class="primary-btn">Find routes</button><button id="btn-clear" class="text-btn">Clear</button></div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </aside>

  <!-- ===== Map controls ===== -->
  <div class="map-ctl" id="map-ctl">
    <button class="fab" id="btn-layers" aria-label="Map layers" title="Layers">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="fab" id="btn-theme" aria-label="Toggle dark mode" title="Theme">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
    </button>
    <button class="fab" id="btn-recenter" aria-label="Fit route" title="Fit to route">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="layers-pop" id="layers-pop" hidden>
      <h4>Map layers</h4>
      <label><input type="checkbox" data-layer="risk"> <i class="lg risk"></i> Road risk heatmap</label>
      <label><input type="checkbox" data-layer="blackspots" checked> <i class="lg bs"></i> Accident blackspots</label>
      <label><input type="checkbox" data-layer="police"> <i class="lg police"></i> Police stations</label>
      <label><input type="checkbox" data-layer="hospital"> <i class="lg hosp"></i> Hospitals</label>
      <label><input type="checkbox" data-layer="cctv"> <i class="lg cctv"></i> CCTV (OSM)</label>
      <p class="hint">Heatmap shows main roads at the chosen hour &amp; mode.</p>
    </div>
  </div>

  <div class="risk-legend" id="risk-legend" hidden>
    <span class="t">Risk vs average road</span>
    <span><i style="background:var(--st-good)"></i>Low</span>
    <span><i style="background:var(--st-warning)"></i>Moderate</span>
    <span><i style="background:var(--st-serious)"></i>High</span>
    <span><i style="background:var(--st-critical)"></i>Very high</span>
  </div>

  <button id="btn-map-view" class="map-view-btn" aria-controls="panel" aria-expanded="true">Show map</button>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- ===== Insights drawer ===== -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="About safety" hidden>
    <header><h2>About safety</h2><button class="icon-btn" id="btn-drawer-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="drawer-body"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js?v=20261025"></script>
</body>
</html>
